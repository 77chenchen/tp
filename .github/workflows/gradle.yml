name: Java CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        # Use Intel macOS runners to avoid the reported ARM64 runner capacity constraints.
        platform: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk+fx

      - name: Build and check with Gradle
        run: ./gradlew check

